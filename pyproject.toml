[project]
name = "sysinternals-mcp"
version = "0.2.0"
description = "MCP server wrapping the Sysinternals tool suite (Handle, Sigcheck, PsList, AccessChk, ProcMon, TcpVcon, AutoRuns, CoreInfo, PsInfo, ListDLLs, ProcDump, Strings) with bootstrap installer + LabLink-first remote dispatch"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Nithin Jose", email = "nijos@microsoft.com"},
]
keywords = ["mcp", "sysinternals", "windows", "procmon", "handle", "sigcheck", "accesschk", "pslist", "ai-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Debuggers",
]
dependencies = [
    "mcp>=1.0",
    "pandas>=2.0",
    "pyarrow>=14.0",
]

# Evidence-store federation is OFF by default and not installed as a
# default dep. The integration in src/sysinternals_mcp/evidence_integration.py
# is guarded by ``try/except ImportError`` AND the
# ``SYSINTERNALS_MCP_EVIDENCE_PATH`` env var, so an unchanged-env install
# behaves identically with or without the library installed.
#
# To enable evidence federation:
#
#   1. Install the evidence-store library from its repo. It is not on PyPI:
#
#         uv pip install git+https://github.com/nijosmsft/evidence-store
#
#      or, for a local checkout:
#
#         uv pip install -e ../evidence-store
#
#   2. Set the env var:
#
#         $env:SYSINTERNALS_MCP_EVIDENCE_PATH = "C:\evidence"
#
# Once both gates are satisfied the evidence tools will write entities
# for the local machine into the per-machine DuckDB under
# ``$SYSINTERNALS_MCP_EVIDENCE_PATH``.

[project.urls]
Homepage = "https://github.com/nijosmsft/sysinternals-mcp"
Repository = "https://github.com/nijosmsft/sysinternals-mcp"
Issues = "https://github.com/nijosmsft/sysinternals-mcp/issues"

[project.scripts]
sysinternals-mcp = "sysinternals_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sysinternals_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
